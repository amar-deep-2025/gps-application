spring.application.name=auth-service
server.port=5051

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.access.secret=${JWT_ACCESS_KEY}
jwt.expiration-ms=900000
refresh-token-expiration-ms=${REFRESH_TOKEN_EXPIRATION}
password-reset-token.expiration-ms=${PASSWORD_RESET_TOKEN_EXPIRATION_MS}
email-verification-token.expiration-ms=${EMAIL_VERIFICATION_TOKEN_EXPIRATION_MS}

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true