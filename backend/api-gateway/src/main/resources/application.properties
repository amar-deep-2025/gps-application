spring.application.name=api-gateway
server.port=5050

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.cloud.gateway.routes[0].id=device-service
spring.cloud.gateway.routes[0].uri=lb://DEVICE-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/devices/**

eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1

management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://127.0.0.1:9411/api/v2/spans