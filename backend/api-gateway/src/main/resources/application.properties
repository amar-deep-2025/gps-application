spring.application.name=api-gateway
server.port=5050

# Permit the local Expo Web preview to call APIs through this gateway.
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:8081,http://localhost:8082,http://127.0.0.1:8081,http://127.0.0.1:8082
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].max-age=3600

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.cloud.gateway.routes[0].id=device-service
spring.cloud.gateway.routes[0].uri=lb://DEVICE-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/devices/**

spring.cloud.gateway.routes[1].id=device-model-route
spring.cloud.gateway.routes[1].uri=lb://DEVICE-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/device-models/**

spring.cloud.gateway.routes[2].id=auth-service
spring.cloud.gateway.routes[2].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.routes[3].id=tracking-service
spring.cloud.gateway.routes[3].uri=lb://TRACKING-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/locations/**

eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1

management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://127.0.0.1:9411/api/v2/spans

